name: Publicar Mi Note X10 v0.12 corregida verificada
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-v012-fixed-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  immutable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar APK verificada de compilacion exitosa
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checked
          gh run download 44077174780 --repo "$GITHUB_REPOSITORY" --name Mi-Note-X10-v0.12-APK --dir checked
          APK="$(find checked -type f -name 'Mi-Note-X10-Android-v0.12.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          printf '%s  %s\n' c7336d53b020627ba16f40db2bbff03729a56e041b04c93295b2ef4e1ca5ff3b "$APK" | sha256sum --check
          cp "$APK" Mi-Note-X10-Android-v0.12-corregida.apk
          sha256sum Mi-Note-X10-Android-v0.12-corregida.apk > SHA256SUMS.txt
      - name: Publicar etiqueta independiente y estable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create android-v0.12-corregida Mi-Note-X10-Android-v0.12-corregida.apk SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target 118c03c91620f01e75aa7c906dc35df228bb4504 \
            --title 'Mi Note X10 Android V0.12 corregida — horizontal y pizarra TV' \
            --notes 'Copia inmovil de la APK V0.12 compilacion 44077174780, SHA256 c7336d53b020627ba16f40db2bbff03729a56e041b04c93295b2ef4e1ca5ff3b. Corrige centrado horizontal, elimina panel Hoja 1 y exportaciones del modo TV, oculta boton secundario Conectar directamente y conserva conexion X10 mediante boton superior. Compilada y firmada. Sin validar visualmente en telefono real. Antes de instalar, guardar respaldo JSON y conservar clave Drive; firma APK nueva exige reinstalar.' \
            --prerelease --latest=false
