name: Recuperar APK V0.20 ya compilada y publicarla
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/republish-android-v020.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar APK firmada ya compilada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk
          gh run download 44153328044 --repo "$GITHUB_REPOSITORY" --name Mi-Note-X10-v0.20-APK --dir apk
          test -s apk/Mi-Note-X10-Android-v0.20.apk
          echo 'e8d2a5c41bfd59471983b2e16149a1e3624f11d75e05e2703b62b05ab95be3b4  apk/Mi-Note-X10-Android-v0.20.apk' | sha256sum -c -
      - name: Crear Release V0.20 sin compilar otra vez
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view android-v0.20 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'La versión V0.20 ya está publicada.'
            exit 0
          fi
          gh release create android-v0.20 apk/Mi-Note-X10-Android-v0.20.apk apk/PERMISOS.txt apk/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.20 — trazos fluidos' \
            --notes 'APK compilada en el run 44153328044, validada por SHA256. Incorpora menú V0.19 y trazado incremental sobre overlay, rAF y guardado agrupado. Aún requiere validación de escritura física Huion X10. Respalde sus cuadernos antes de instalar.' \
            --prerelease --latest=false
