name: Mi Note X10 Android v0.11 - hojas horizontales y pizarra TV
on:
  push:
    branches: [main]
    paths:
      - 'x10-ble.js'
      - 'styles.css'
      - 'app.js'
      - 'index.html'
      - 'android-native/**'
      - '.github/workflows/android-release-v011.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: |
          npm run prepare:android
          node scripts/features.mjs
          node scripts/mobile.mjs
          node scripts/landscape.mjs
          node --check stage/app.js
          node --check stage/memory-import.js
          node --check stage/landscape-ui.js
          node --check stage/personal-backup.js
          npx vite build
          sed -i 's/Mi Note X10 Android V0.4/Mi Note X10 Android V0.11/g' dist/index.html
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden.mjs
          node native-backup/setup.mjs
          sed -i -E 's/versionCode [0-9]+/versionCode 11/; s/versionName "[^"]+"/versionName "0.11.0"/' android/app/build.gradle
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          for n in 1 2 3 4; do
            if ./gradlew assembleRelease --max-workers=2 --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$n" -eq 4 ]; then
              echo 'La compilación Android no se pudo completar tras 4 intentos.'
              exit 1
            fi
            echo "Fallo transitorio de dependencias: reintento $n/4."
            sleep 20
          done
      - name: Firmar APK de produccion para pruebas privadas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          PASSWORD="$(openssl rand -hex 28)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
            -alias minote-x10 -dname "CN=Mi Note X10 Android, OU=Private Project" \
            -keystore "$RUNNER_TEMP/minote-v02-release.jks" -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/minote-v02-release.jks" \
            --ks-key-alias minote-x10 --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" --out signed/Mi-Note-X10-Android-v0.11.apk \
            signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed/Mi-Note-X10-Android-v0.11.apk
          sha256sum signed/Mi-Note-X10-Android-v0.11.apk | tee signed/SHA256SUMS.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.11.apk | tee signed/PERMISOS.txt
          if grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt; then
            echo 'ERROR: permiso INTERNET incluido' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.11-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.11.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      - name: Publicar Mi Note X10 Android v0.11
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # La publicación final reemplaza artefactos de compilaciones previas de prueba.
          if gh release view android-v0.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-v0.11 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create android-v0.11 signed/Mi-Note-X10-Android-v0.11.apk signed/SHA256SUMS.txt signed/PERMISOS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.11 — hojas horizontales y pizarra TV' \
            --notes 'V0.11 agrega orientacion de hoja A5 vertical, horizontal derecha e izquierda por pagina, sin convertir ni deformar los trazos guardados. El lienzo transforma su dibujo y el tactil inversamente. Modo pizarra TV en pantalla completa intenta bloquear pantalla horizontal y oculta UI, salvo controles de lapiz, borrador, pagina, giro, deshacer y salir. La proyeccion real requiere duplicacion de pantalla mediante Android/Chromecast/HDMI, no se conecta automaticamente a TV. Preserva Bluetooth X10, la importacion offline experimental, respaldo privado en Drive y reproduccion. APK experimental no probada en dispositivo; haga respaldo JSON antes de reinstalar. Firma temporal distinta.' \
            --prerelease --latest=false
