name: Android APK - Mi Note X10
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-native
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Usar Android SDK preinstalado
        run: echo "ANDROID_HOME=$ANDROID_HOME" && test -d "$ANDROID_HOME/platforms"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Probar puente Bluetooth
        run: npm test
      - name: Preparar interfaz Android
        run: npm run build:web
      - name: Crear proyecto Android y sincronizar
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK de prueba
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Publicar APK descargable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-Android-debug
          path: android-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
