name: Mi Note X10 Android v0.80 - compartir Android y selector de figura
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'android-native/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Una sola compilación/publicación vigente: evita que una revisión anterior
# borre o sustituya la APK actual al terminar una ejecución concurrente.
concurrency:
  group: mi-note-x10-android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      # No build signed or release can proceed without one persistent signing identity.
      # An old installation signed with a throwaway key cannot be updated in place.
      - name: Exigir firma permanente antes de compilar
        env:
          MINOTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINOTE_RELEASE_KEYSTORE_BASE64 }}
          MINOTE_RELEASE_STORE_PASSWORD: ${{ secrets.MINOTE_RELEASE_STORE_PASSWORD }}
          MINOTE_RELEASE_KEY_PASSWORD: ${{ secrets.MINOTE_RELEASE_KEY_PASSWORD }}
          MINOTE_RELEASE_KEY_ALIAS: ${{ secrets.MINOTE_RELEASE_KEY_ALIAS }}
          MINOTE_RELEASE_CERT_SHA256: ${{ vars.MINOTE_RELEASE_CERT_SHA256 }}
        run: node scripts/signing-guard.mjs check-env
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: |
          npm run prepare:android
          node scripts/features.mjs
          node scripts/mobile.mjs
          node scripts/landscape.mjs
          node scripts/safe-page-delete.mjs
          node scripts/android-actions.mjs
          node scripts/enable-v019.mjs
          node scripts/performance-v020.mjs
          node scripts/enable-v021.mjs
          node scripts/battery-v022.mjs
          node scripts/enable-v022.mjs
          node scripts/math-stage.mjs
          node --check stage/math/math-worker.js
          node --check stage/math/math-controller.js
          node --check stage/math/math-geometry.mjs
          node --check stage/math/math-strong-geometry.mjs
          node --check stage/math/math-intention.mjs
          node --check stage/math/math-auto.mjs
          node --check stage/math/math-ink-ocr.mjs
          node --check stage/ink-orientation.mjs
          test -f stage/ink-orientation.mjs
          node --check stage/app.js
          node --check stage/memory-import.js
          node --check stage/huion-archive.js
          node --check stage/floating-page-x10.js
          node --check stage/landscape-ui.js
          node --check stage/floating-ui.js
          node --check stage/library-page-ui.js
          node --check stage/android-ui-main.js
          node --check stage/floating-page-x10.js
          node --check stage/floating-geometry.mjs
          node --check stage/personal-backup.js
          node --check stage/export-native.js
          node --check stage/share-documents.js
          node scripts/assert-v018.mjs
          node --check stage/app.js
          node --check stage/android-ui-main.js
          node --check stage/menu-v019.js
          node scripts/assert-v019.mjs
          node scripts/assert-v020.mjs
          node --check stage/library-v021.js
          node scripts/assert-v021.mjs
          node --check stage/x10-ble.js
          node --check stage/battery-ui-v022.js
          node scripts/assert-v022.mjs
          # Corregido cierre de biblioteca sobre el propio diálogo, sin IDs duplicados.
          # Revision final de mejoras en trazos, guardado e interfaz.
          # Validar selector sin expresiones regulares ambiguas en Node 22.
          npx vite build
          sed -i 's/Mi Note X10 Android V0.42/Mi Note X10 Android V0.80/g' dist/index.html
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          # Kotlin 2.2.20 puede perder la variante gradle813 en Gradle 8.14.
          # Fijar una versión compatible, sin modificar el código BLE Huion.
          printf "\next.kotlin_version = '2.3.20'\n" >> android/variables.gradle
          node scripts/harden.mjs
          node native-backup/setup.mjs
          grep -Fq 'MiNoteShareProvider' android/app/src/main/AndroidManifest.xml
          grep -Fq 'minote_share_paths' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/versionCode [0-9]+/versionCode 80/; s/versionName "[^"]+"/versionName "0.80.0"/' android/app/build.gradle
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          for n in 1 2 3 4; do
            if ./gradlew assembleRelease --max-workers=2 --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$n" -eq 4 ]; then
              echo 'La compilación Android no se pudo completar tras 4 intentos.'
              exit 1
            fi
            echo "Fallo transitorio de dependencias: reintento $n/4."
            sleep 20
          done
      - name: Firmar APK con clave permanente protegida
        shell: bash
        env:
          MINOTE_RELEASE_KEYSTORE_BASE64: ${{ secrets.MINOTE_RELEASE_KEYSTORE_BASE64 }}
          MINOTE_RELEASE_STORE_PASSWORD: ${{ secrets.MINOTE_RELEASE_STORE_PASSWORD }}
          MINOTE_RELEASE_KEY_PASSWORD: ${{ secrets.MINOTE_RELEASE_KEY_PASSWORD }}
          MINOTE_RELEASE_KEY_ALIAS: ${{ secrets.MINOTE_RELEASE_KEY_ALIAS }}
          MINOTE_RELEASE_CERT_SHA256: ${{ vars.MINOTE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          node scripts/signing-guard.mjs check-env
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          KEYSTORE="$RUNNER_TEMP/minote-release-permanent.p12"
          trap 'rm -f "$KEYSTORE" signed/unsigned-aligned.apk' EXIT
          printf '%s' "$MINOTE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          # Verify expected fingerprint from the keystore BEFORE using it.
          keytool -list -v -keystore "$KEYSTORE" -storetype PKCS12             -storepass:env MINOTE_RELEASE_STORE_PASSWORD -alias "$MINOTE_RELEASE_KEY_ALIAS"             | sed -n '/SHA256:/p' | head -n 1 > signed/cert-from-keystore.txt
          # Do not print the certificate here; verify the APK after signing.
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-type PKCS12             --ks-key-alias "$MINOTE_RELEASE_KEY_ALIAS"             --ks-pass env:MINOTE_RELEASE_STORE_PASSWORD             --key-pass env:MINOTE_RELEASE_KEY_PASSWORD             --out signed/Mi-Note-X10-Android-v0.80.apk             signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose signed/Mi-Note-X10-Android-v0.80.apk
          "$TOOLS/apksigner" verify --print-certs signed/Mi-Note-X10-Android-v0.80.apk             | node scripts/signing-guard.mjs verify-apk
          rm -f signed/cert-from-keystore.txt
          sha256sum signed/Mi-Note-X10-Android-v0.80.apk | tee signed/SHA256SUMS.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.80.apk | tee signed/PERMISOS.txt
          "$TOOLS/aapt" dump xmltree signed/Mi-Note-X10-Android-v0.80.apk AndroidManifest.xml | tee signed/MANIFIESTO.txt
          grep -Fq 'cl.stikgatica.minote.x10.minote.files' signed/MANIFIESTO.txt
          # INTERNET se usa solamente para descargar el modelo español ML Kit
          # tras acción explícita del usuario. El reconocimiento ya descargado es local.
          grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt
          if grep -Fq 'android.permission.READ_CALENDAR' signed/PERMISOS.txt ||
             grep -Fq 'android.permission.WRITE_CALENDAR' signed/PERMISOS.txt; then
            echo 'ERROR: permisos globales de calendario incluidos' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.80-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.80.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      # Independent gate: no release may be uploaded without certificate pin.
      - name: Confirmar identidad antes de publicar
        shell: bash
        env:
          MINOTE_RELEASE_CERT_SHA256: ${{ vars.MINOTE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose signed/Mi-Note-X10-Android-v0.80.apk
          "$TOOLS/apksigner" verify --print-certs signed/Mi-Note-X10-Android-v0.80.apk             | node scripts/signing-guard.mjs verify-apk
      - name: Publicar Mi Note X10 Android v0.80
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # La publicación final reemplaza artefactos de compilaciones previas de prueba.
          if gh release view android-v0.80 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-v0.80 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create android-v0.80 signed/Mi-Note-X10-Android-v0.80.apk signed/SHA256SUMS.txt signed/PERMISOS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.80 — actualizaciones con firma permanente' \
            --notes 'V0.80: firma permanente obligatoria desde secretos protegidos GitHub; se verifica el SHA-256 del certificado antes de publicar. Compatible con actualizaciones sobre APK previamente firmadas con esta MISMA clave. Instalaciones V0.79 y anteriores con firma efímera requieren exportar cuadernos, comprobar el respaldo y migrar una única vez; no desinstalar sin respaldo comprobado. Conserva OCR matemático y datos locales sin migración ni borrado.' \
            --prerelease --latest=false
