name: Publicar APK Android para descarga directa
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-apk-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar APK ya compilado
        uses: actions/download-artifact@v4
        with:
          name: Mi-Note-X10-Android-debug
          run-id: '43981355062'
          github-token: ${{ github.token }}
          path: ./apk

      - name: Verificar APK y preparar nombre
        run: |
          test -s ./apk/app-debug.apk
          file ./apk/app-debug.apk
          cp ./apk/app-debug.apk ./apk/Mi-Note-X10-Android-v0.1.apk
          sha256sum ./apk/Mi-Note-X10-Android-v0.1.apk

      - name: Crear enlace publico y permanente de descarga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-v0.1 ./apk/Mi-Note-X10-Android-v0.1.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create android-v0.1 ./apk/Mi-Note-X10-Android-v0.1.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Mi Note X10 para Android v0.1 (prueba)' \
              --notes 'APK Android de prueba con Bluetooth LE nativo. La conexión real con Huion Note X10 sigue pendiente de validación. No eliminar la PWA ni sus datos locales. No usar para información confidencial. Archivo: Mi-Note-X10-Android-v0.1.apk.' \
              --latest=false
          fi
