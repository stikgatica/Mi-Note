name: Mi Note X10 Android v0.6 - hoja maximizada y X10 directo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-v05.yml'
      - 'x10-ble.js'
      - 'styles.css'
      - 'app.js'
      - 'index.html'
      - 'android-native/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: |
          npm run prepare:android
          node scripts/features.mjs
          node scripts/mobile.mjs
          npx vite build
          sed -i 's/Mi Note X10 Android V0.4/Mi Note X10 Android V0.6/g' dist/index.html
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden.mjs
          sed -i -E 's/versionCode [0-9]+/versionCode 6/; s/versionName "[^"]+"/versionName "0.6.0"/' android/app/build.gradle
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Firmar APK de produccion para pruebas privadas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          PASSWORD="$(openssl rand -hex 28)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
            -alias minote-x10 -dname "CN=Mi Note X10 Android, OU=Private Project" \
            -keystore "$RUNNER_TEMP/minote-v02-release.jks" -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/minote-v02-release.jks" \
            --ks-key-alias minote-x10 --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" --out signed/Mi-Note-X10-Android-v0.6.apk \
            signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed/Mi-Note-X10-Android-v0.6.apk
          sha256sum signed/Mi-Note-X10-Android-v0.6.apk | tee signed/SHA256SUMS.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.6.apk | tee signed/PERMISOS.txt
          if grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt; then
            echo 'ERROR: permiso INTERNET incluido' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.6-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.6.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      - name: Publicar Mi Note X10 Android v0.6
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create android-v0.6 signed/Mi-Note-X10-Android-v0.6.apk signed/SHA256SUMS.txt signed/PERMISOS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.6 — escritura a pantalla amplia' \
            --notes 'Interfaz optimizada para telefono: hoja A5 protagonista, herramientas compactas, paginador inferior y opciones en menu. Boton superior X10 reutiliza la conexion directa funcional; ajustes experimentales quedan fuera de la vista principal. Conserva cuadernos, respaldo JSON y funciones BLE. No se ha probado en el telefono; antes de desinstalar V0.5 haga respaldo JSON. Sin permiso INTERNET.' \
            --prerelease --latest=false
