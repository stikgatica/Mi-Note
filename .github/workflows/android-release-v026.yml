name: Mi Note X10 Android v0.26 - explorar páginas omitidas de la memoria X10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-v026.yml'
      - 'android-native/src/offline-x10.js'
      - 'android-native/tests/offline-index-fallback.test.mjs'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: |
          npm run prepare:android
          node scripts/features.mjs
          node scripts/mobile.mjs
          node scripts/landscape.mjs
          node scripts/safe-page-delete.mjs
          node scripts/android-actions.mjs
          node scripts/enable-v019.mjs
          node scripts/performance-v020.mjs
          node scripts/enable-v021.mjs
          node scripts/battery-v022.mjs
          node scripts/enable-v022.mjs
          node --check stage/app.js
          node --check stage/memory-import.js
          node --check stage/landscape-ui.js
          node --check stage/floating-ui.js
          node --check stage/library-page-ui.js
          node --check stage/android-ui-main.js
          node --check stage/floating-page-x10.js
          node --check stage/floating-geometry.mjs
          node --check stage/personal-backup.js
          node scripts/assert-v018.mjs
          node --check stage/app.js
          node --check stage/android-ui-main.js
          node --check stage/menu-v019.js
          node scripts/assert-v019.mjs
          node scripts/assert-v020.mjs
          node --check stage/library-v021.js
          node scripts/assert-v021.mjs
          node --check stage/x10-ble.js
          node --check stage/battery-ui-v022.js
          node scripts/assert-v022.mjs
          # Corregido cierre de biblioteca sobre el propio diálogo, sin IDs duplicados.
          # Revision final de mejoras en trazos, guardado e interfaz.
          # Validar selector sin expresiones regulares ambiguas en Node 22.
          npx vite build
          sed -i 's/Mi Note X10 Android V0.4/Mi Note X10 Android V0.26/g' dist/index.html
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden.mjs
          node native-backup/setup.mjs
          sed -i -E 's/versionCode [0-9]+/versionCode 26/; s/versionName "[^"]+"/versionName "0.26.0"/' android/app/build.gradle
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          for n in 1 2 3 4; do
            if ./gradlew assembleRelease --max-workers=2 --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$n" -eq 4 ]; then
              echo 'La compilación Android no se pudo completar tras 4 intentos.'
              exit 1
            fi
            echo "Fallo transitorio de dependencias: reintento $n/4."
            sleep 20
          done
      - name: Firmar APK de produccion para pruebas privadas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          PASSWORD="$(openssl rand -hex 28)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
            -alias minote-x10 -dname "CN=Mi Note X10 Android, OU=Private Project" \
            -keystore "$RUNNER_TEMP/minote-v02-release.jks" -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/minote-v02-release.jks" \
            --ks-key-alias minote-x10 --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" --out signed/Mi-Note-X10-Android-v0.26.apk \
            signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed/Mi-Note-X10-Android-v0.26.apk
          sha256sum signed/Mi-Note-X10-Android-v0.26.apk | tee signed/SHA256SUMS.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.26.apk | tee signed/PERMISOS.txt
          if grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt; then
            echo 'ERROR: permiso INTERNET incluido' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.26-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.26.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      - name: Publicar Mi Note X10 Android v0.26
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # La publicación final reemplaza artefactos de compilaciones previas de prueba.
          if gh release view android-v0.26 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-v0.26 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create android-v0.26 signed/Mi-Note-X10-Android-v0.26.apk signed/SHA256SUMS.txt signed/PERMISOS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.26 — recuperación de hojas físicas vacías' \
            --notes 'V0.26: al leer la memoria, Mi Note continúa si la hoja 0 u otra contiene paquetes sin trazos, examina como mínimo índices 0 a 15 cuando 0x85 indica pocos índices y reporta los no decodificables. Mantiene 0x88, descarta importación incompleta, jamás borra memoria X10 (sin 0x8B ni 0x8C). Incluye pruebas de regresión; VALIDACIÓN PENDIENTE CON X10 FÍSICA. Prerelanzamiento de prueba. Respaldo JSON antes de reinstalar el APK, porque la firma de compilación cambia.' \
            --prerelease --latest=false
