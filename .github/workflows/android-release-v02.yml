name: Mi Note X10 Android v0.2 - APK release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-v02.yml'
      - 'android-native/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: npm run build:web
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden.mjs
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Firmar APK de produccion para pruebas privadas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          PASSWORD="$(openssl rand -hex 28)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
            -alias minote-x10 -dname "CN=Mi Note X10 Android, OU=Private Project" \
            -keystore "$RUNNER_TEMP/minote-v02-release.jks" -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          printf '%s' "$PASSWORD" > "$RUNNER_TEMP/signing-password.txt"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/minote-v02-release.jks" \
            --ks-key-alias minote-x10 --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" --out signed/Mi-Note-X10-Android-v0.2.apk \
            signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed/Mi-Note-X10-Android-v0.2.apk
          sha256sum signed/Mi-Note-X10-Android-v0.2.apk | tee signed/SHA256SUMS.txt
          mkdir -p signing-backup
          cp "$RUNNER_TEMP/minote-v02-release.jks" signing-backup/minote-v02-release.jks
          cp "$RUNNER_TEMP/signing-password.txt" signing-backup/signing-password.txt
          echo 'CONFIDENCIAL: Guarda la clave y contraseña fuera de GitHub. Necesarias para futuras versiones firmadas con la misma identidad.' > signing-backup/INSTRUCCIONES.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.2.apk | tee signed/PERMISOS.txt
          if grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt; then
            echo 'ERROR: permiso INTERNET incluido' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.2-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.2.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      - name: Respaldo PRIVADO de firma para futuras actualizaciones
        uses: actions/upload-artifact@v4
        with:
          name: PRIVADO-clave-firma-Mi-Note-X10-v0.2
          path: android-native/signing-backup/*
          retention-days: 7
          if-no-files-found: error
      - name: Publicar descarga directa del APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create android-v0.2 signed/Mi-Note-X10-Android-v0.2.apk signed/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.2 — prueba privada firmada' \
            --notes 'APK Android firmado en modo release (sin depuración). Sin permiso Internet y sin sincronización Drive en este APK; respaldo automático desactivado. Bluetooth LE nativo y cuadernos locales. Esta versión NO ha superado auditoría independiente ni prueba con una X10 física; Play Protect puede seguir mostrando avisos por ser desarrollador nuevo. La firma privada solo se entrega como artefacto restringido del flujo por 7 días; guárdala fuera de GitHub para futuras actualizaciones. La firma es diferente de la V0.1: no instalar encima de la V0.1.' \
            --prerelease --latest=false
