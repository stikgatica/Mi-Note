name: Mi Note X10 Android v0.15 - paginas y conexion X10 en barra
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release-v015.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Comprobar SDK Android
        run: test -d "$ANDROID_HOME/build-tools"
      - name: Dependencias y pruebas
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Preparar Mi Note privada
        run: |
          npm run prepare:android
          node scripts/features.mjs
          node scripts/mobile.mjs
          node scripts/landscape.mjs
          node scripts/safe-page-delete.mjs
          node --check stage/app.js
          node --check stage/memory-import.js
          node --check stage/landscape-ui.js
          node --check stage/floating-ui.js
          node --check stage/floating-page-x10.js
          node --check stage/floating-geometry.mjs
          node --check stage/personal-backup.js
          node scripts/assert-clean.mjs
          node scripts/assert-v015.mjs
          # Comprobaciones de regresión: sin botón duplicado, TV aislada y menú horizontal accesible.
          node -e "const fs=require('fs');const h=fs.readFileSync('stage/index.html','utf8');const css=fs.readFileSync('stage/landscape-ui.css','utf8');if(h.includes('Conectar Huion X10 directamente'))throw Error('Boton duplicado aun visible');if(!h.includes('id=\"x10DirectConnect\"'))throw Error('Se ha perdido el puente BLE');if(!css.includes('body.minote-android.tv-board .page-top'))throw Error('Falta ocultar titulo y exportaciones');if(!css.includes('body.minote-android .paper-shell[data-orientation^='))throw Error('Falta encaje A5 horizontal');if(!css.includes('#mobileMoreDialog[open]'))throw Error('Menu horizontal no accesible')"
          node -e "const fs=require('fs');const h=fs.readFileSync('stage/index.html','utf8');const css=fs.readFileSync('stage/floating-ui.css','utf8');const js=fs.readFileSync('stage/floating-ui.js','utf8');if(!h.includes('src=\"./floating-ui.js\"'))throw Error('Barra flotante no cargada');if(!h.includes('href=\"./floating-ui.css\"'))throw Error('Estilos flotantes no cargados');if(!css.includes('.clean-notes'))throw Error('Falta modo limpio');for(const name of ['tvBoardHandle','floatingMinimize','floatingLibraryBackdrop','floatingAxisMenu','floatingLockMenu'])if(!js.includes(name))throw Error('Falta control '+name);"
          npx vite build
          sed -i 's/Mi Note X10 Android V0.4/Mi Note X10 Android V0.15/g' dist/index.html
      - name: Crear Android y configurar privacidad
        run: |
          npx cap add android
          npx cap sync android
          node scripts/harden.mjs
          node native-backup/setup.mjs
          sed -i -E 's/versionCode [0-9]+/versionCode 15/; s/versionName "[^"]+"/versionName "0.15.0"/' android/app/build.gradle
      - name: Generar APK release sin depuracion
        run: |
          cd android
          chmod +x gradlew
          for n in 1 2 3 4; do
            if ./gradlew assembleRelease --max-workers=2 --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$n" -eq 4 ]; then
              echo 'La compilación Android no se pudo completar tras 4 intentos.'
              exit 1
            fi
            echo "Fallo transitorio de dependencias: reintento $n/4."
            sleep 20
          done
      - name: Firmar APK de produccion para pruebas privadas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$TOOLS/zipalign"
          test -x "$TOOLS/apksigner"
          mkdir -p signed
          PASSWORD="$(openssl rand -hex 28)"
          keytool -genkeypair -noprompt -keyalg RSA -keysize 3072 -validity 10000 \
            -alias minote-x10 -dname "CN=Mi Note X10 Android, OU=Private Project" \
            -keystore "$RUNNER_TEMP/minote-v02-release.jks" -storetype PKCS12 \
            -storepass "$PASSWORD" -keypass "$PASSWORD"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" signed/unsigned-aligned.apk
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/minote-v02-release.jks" \
            --ks-key-alias minote-x10 --ks-pass "pass:$PASSWORD" \
            --key-pass "pass:$PASSWORD" --out signed/Mi-Note-X10-Android-v0.15.apk \
            signed/unsigned-aligned.apk
          "$TOOLS/apksigner" verify --verbose --print-certs signed/Mi-Note-X10-Android-v0.15.apk
          sha256sum signed/Mi-Note-X10-Android-v0.15.apk | tee signed/SHA256SUMS.txt
      - name: Verificar permisos del APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/aapt" dump permissions signed/Mi-Note-X10-Android-v0.15.apk | tee signed/PERMISOS.txt
          if grep -Fq 'android.permission.INTERNET' signed/PERMISOS.txt; then
            echo 'ERROR: permiso INTERNET incluido' >&2; exit 1
          fi
      - name: Guardar APK para respaldo
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Note-X10-v0.15-APK
          path: |
            android-native/signed/Mi-Note-X10-Android-v0.15.apk
            android-native/signed/SHA256SUMS.txt
            android-native/signed/PERMISOS.txt
          if-no-files-found: error
      - name: Publicar Mi Note X10 Android v0.15
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # La publicación final reemplaza artefactos de compilaciones previas de prueba.
          if gh release view android-v0.15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete android-v0.15 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create android-v0.15 signed/Mi-Note-X10-Android-v0.15.apk signed/SHA256SUMS.txt signed/PERMISOS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Mi Note X10 Android V0.15 — numero de hoja y estado Huion X10' \
            --notes 'V0.15 añade número actual / total entre las flechas de la barra flotante. Al pulsarlo muestra Ir a otra hoja y Eliminar hoja con confirmación; al eliminar elige la hoja vecina válida, mantiene al menos una hoja y actualiza el vínculo X10 si está conectado. El indicador Huion X10 tiene punto de estado gris (desconectado), azul (conectando), verde (conectado) o rojo (error). Desde el menú se puede conectar sin abrir un cuadro previo al selector BLE, desconectar y ver el diagnóstico. Conserva la interfaz flotante siempre activa, pizarra TV, Drive y recuperación de memoria. Compilado automáticamente; validar con Huion física antes de uso crítico. La firma APK cambia, realizar Respaldo JSON y conservar contraseña Drive antes de instalar.' \
            --prerelease --latest=false
